version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elbis
      POSTGRES_PASSWORD: elbis_pass
      POSTGRES_DB: elbis_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - '8000:8000'
    depends_on:
      - postgres
    volumes:
      # Host'taki backend/data/ dizinini container'a bağla.
      # telegram.session burada oluşur ve container yeniden başlasa da kalır.
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  pgdata:
